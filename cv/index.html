<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pedro Ourique - Resume</title>
    <meta
      name="description"
      content="Resume of Pedro Ourique, software developer: experience, projects and skills."
    />
    <link rel="canonical" href="https://pedroou.github.io/Landing-Pdr/cv/" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#f9fafb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d1012" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Apply a saved theme before first paint, so it never flashes (src/theme.ts).
      try {
        const theme = localStorage.getItem("theme");
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      } catch {}
    </script>

    <meta property="og:type" content="profile" />
    <meta property="og:url" content="https://pedroou.github.io/Landing-Pdr/cv/" />
    <meta property="og:title" content="Pedro Ourique - Resume" />
    <meta
      property="og:description"
      content="Experience, projects and skills of Pedro Ourique, software developer."
    />
    <meta property="og:image" content="https://pedroou.github.io/Landing-Pdr/og.png" />
    <meta property="og:image:alt" content="Pedro Ourique, software developer" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/pages/cv/main.tsx"></script>
  </body>
</html>
