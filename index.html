<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pedro Ourique</title>
    <meta
      name="description"
      content="Pedro Ourique, full-stack developer building AI video analytics and business software with TypeScript, React, Python and Docker."
    />
    <link rel="canonical" href="https://pedroou.github.io/Landing-Pdr/" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#f9fafb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d1012" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Apply a saved theme before first paint, so it never flashes (src/theme.ts).
      try {
        const theme = localStorage.getItem("theme");
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      } catch {}
    </script>

    <meta property="og:type" content="profile" />
    <meta property="og:url" content="https://pedroou.github.io/Landing-Pdr/" />
    <meta property="og:title" content="Pedro Ourique" />
    <meta
      property="og:description"
      content="Full-stack developer building AI video analytics and business software with TypeScript, React, Python and Docker."
    />
    <meta property="og:image" content="https://pedroou.github.io/Landing-Pdr/og.png" />
    <meta property="og:image:alt" content="Pedro Ourique, software developer" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="pt_BR" />
    <meta name="twitter:card" content="summary_large_image" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfilePage",
        "mainEntity": {
          "@type": "Person",
          "name": "Pedro Ourique",
          "jobTitle": "Software Developer",
          "url": "https://pedroou.github.io/Landing-Pdr/",
          "sameAs": [
            "https://github.com/Pedroou",
            "https://www.linkedin.com/in/pedro-guimaraes-ourique/"
          ]
        }
      }
    </script>
    <script>
      // Links to the old hash-routed CV (#/cv) still circulate.
      if (location.hash === "#/cv") location.replace(`cv/${location.search}`);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/pages/landing/main.tsx"></script>
  </body>
</html>
